[project]
name = "phission"
version = "0.2.0"
description = "A synthetic-only email and link-reputation learning demo"
requires-python = ">=3.13,<3.15"
dependencies = ["reflex==0.9.12"]

[dependency-groups]
dev = ["pytest>=8.4,<9", "ruff>=0.12,<0.16"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = [".web", ".cache", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
